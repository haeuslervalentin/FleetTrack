[project]
name = "fleet-mcp"
version = "0.1.0"
description = "A modular MCP-Server for Fleetmanagement"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=2.0,<3.0",
  "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "mcp_server*"]
